[tool.poetry]
name = "operations-analyzer"
version = "1.0.0"
description = "Приложение для анализа банковских операций"
authors = ["Student <student@example.com>"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.0"
openpyxl = "^3.1"
requests = "^2.31"
python-dotenv = "^1.0"
cachetools = "^8.0.0"
xlrd = "^2.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
mypy = "^1.8"
flake8 = "^7.0"
black = "^24.0"
isort = "^5.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true
warn_return_any = true
warn_unreachable = true
exclude = ['venv', 'test']

[flake8]
max-line-length = 119
ignore = ['E203', 'W503']
exclude = ['.git', '__pycharm__', 'venv', '.venv']

[tool.black]
target-version = ["py314"]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py
)
'''

[tool.isort]
line_length = 119
skip_glob = [".mypy_cache/**", "venv/**", ".venv/**", "__pycharm__/**", ".git/**"]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]