[tool.poetry]
name = "operations-analyzer"
version = "1.0.0"
description = "Приложение для анализа банковских операций"
authors = ["Student <student@example.com>"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.0"
openpyxl = "^3.1"
requests = "^2.31"
python-dotenv = "^1.0"
cachetools = "^8.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
mypy = "^1.8"
flake8 = "^7.0"
black = "^24.0"
isort = "^5.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
